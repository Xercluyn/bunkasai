<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>Main menu</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&amp;family=Zen+Maru+Gothic:wght@500;700;900&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#ffb526}a:hover{color:#ffd27a}
button{font-family:inherit}
</style>
</helmet>
<div style="width: 1280px; height: 720px; position: relative; overflow: hidden; font-family: 'Zen Maru Gothic', sans-serif; color: #f2efff; background: linear-gradient(#211b52, #120f2b 78%);">

  <div aria-hidden="true" style="position: absolute; left: 0; right: 0; bottom: 0; height: 72px; background: #0c0a20; border-top: 2px solid #2a2460;"></div>

  <div style="position: absolute; left: 72px; top: 64px; width: 500px; display: flex; flex-direction: column; gap: 10px;">
    <p style="margin: 0; font-size: 18px; font-weight: 700; color: #a9a2d9; letter-spacing: 0.3em;">読祭 2026</p>
    <h1 style="margin: 0; font-family: 'Dela Gothic One', sans-serif; font-weight: 400; font-size: 64px; line-height: 1.12; color: #ffb526; text-shadow: 0 6px 0 #b3560b;">文化祭<br>エレベーター<br>ゲーム</h1>
    <p style="margin: 10px 0 0; font-size: 20px; font-weight: 700; color: #c9c3f0;">ビルの階をクリックして遊ぶフロアを選ぼう</p>
  </div>

  <div style="position: absolute; left: 72px; top: 420px; width: 470px; display: flex; flex-direction: column; gap: 16px;">
    <button style="height: 80px; border: 0; border-radius: 18px; background: #ffb526; color: #3a1a00; font-size: 28px; font-weight: 900; box-shadow: 0 7px 0 #b3560b; cursor: pointer;">▶ 1階から5階まで遊ぶ</button>
    <div style="box-sizing: border-box; min-height: 128px; padding: 20px 24px; border-radius: 18px; background: #241e57; border: 3px solid {{cardBorder}}; display: flex; flex-direction: column; justify-content: center; gap: 4px;">
      <sc-if value="{{hasHover}}" hint-placeholder-val="{{ false }}">
        <p style="margin: 0; font-size: 17px; font-weight: 900; color: #ffb526;">{{lit.label}}　クリックでスタート</p>
        <p style="margin: 0; font-family: 'Dela Gothic One', sans-serif; font-size: 28px; line-height: 1.3;">{{lit.game}}</p>
        <p style="margin: 0; font-size: 15px; color: #a9a2d9;">このフロアのクエストをクリアしたらゲームクリア！</p>
      </sc-if>
      <sc-if value="{{noHover}}" hint-placeholder-val="{{ true }}">
        <p style="margin: 0; font-size: 20px; font-weight: 700; line-height: 1.6; text-align: center;">右のビルの階をクリックすると<br>そのフロアだけ遊べるよ</p>
      </sc-if>
    </div>
  </div>

  <div style="position: absolute; left: 640px; bottom: 72px; width: 420px; display: flex; flex-direction: column; align-items: center;">
    <div aria-hidden="true" style="width: 150px; height: 40px; margin-left: -120px; background: #3a3288; border: 3px solid #5a51b8; border-bottom: 0; border-radius: 6px 6px 0 0;"></div>
    <div aria-hidden="true" style="width: 440px; height: 16px; background: #5a51b8; border-radius: 4px;"></div>
    <div style="width: 420px; position: relative; display: flex; flex-direction: column;">
      <div aria-hidden="true" style="position: absolute; left: 192px; top: 0; bottom: 0; width: 36px; background: #15122f;"></div>
      <div aria-hidden="true" style="position: absolute; left: 196px; width: 28px; height: 64px; top: {{carTop}}px; background: #ffb526; border-radius: 4px; box-shadow: 0 0 20px #ffb526aa; transition: top 0.45s cubic-bezier(.4,1.4,.5,1);"></div>
      <sc-for list="{{floors}}" as="f" hint-placeholder-count="5">
        <button onMouseEnter="{{f.hover}}" onMouseLeave="{{unhover}}" aria-label="{{f.label}} {{f.game}}" style="{{f.style}}">
          <span style="display: flex; gap: 12px;"><span style="width: 30px; height: 40px; border-radius: 3px; background: {{f.window}};"></span><span style="width: 30px; height: 40px; border-radius: 3px; background: {{f.window}};"></span></span>
          <span style="width: 60px;"></span>
          <span style="display: flex; gap: 12px;"><span style="width: 30px; height: 40px; border-radius: 3px; background: {{f.window}};"></span><span style="width: 30px; height: 40px; border-radius: 3px; background: {{f.window}};"></span></span>
        </button>
      </sc-for>
    </div>
    <div aria-hidden="true" style="width: 460px; height: 14px; background: #5a51b8; border-radius: 4px;"></div>
  </div>

  <div style="position: absolute; left: 1080px; bottom: 86px; display: flex; flex-direction: column; gap: 18px;">
    <sc-for list="{{floors}}" as="f" hint-placeholder-count="5">
      <div style="height: 74px; display: flex; flex-direction: column; justify-content: center;">
        <span style="font-family: 'Dela Gothic One', sans-serif; font-size: {{f.nameSize}}px; line-height: 1.1; color: {{f.labelColor}};">{{f.label}}</span>
        <span style="font-size: 13px; font-weight: 700; color: #a9a2d9;">{{f.game}}</span>
      </div>
    </sc-for>
  </div>

  <button style="position: absolute; right: 24px; top: 24px; height: 46px; padding: 0 24px; border-radius: 23px; background: #241e57; color: #f2efff; border: 2px solid #3b3380; font-size: 18px; font-weight: 700; cursor: pointer;">English</button>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":720}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { hover: 0 }; }
  renderVals() {
    const games = ['エレベーターのボタンゲーム', 'コインを集めてチケットを買おう', '建築学科の動物クイズ', 'スタジオの屋台マッチング', '新聞配達ラン'];
    const lit = this.state.hover;
    const floors = [5, 4, 3, 2, 1].map((n) => {
      const on = n === lit;
      return {
        label: n + '階',
        game: games[n - 1],
        window: on ? '#ffd27a' : '#2a2660',
        labelColor: on ? '#ffb526' : '#f2efff',
        nameSize: on ? 38 : 30,
        style: 'height: 92px; display: flex; align-items: center; justify-content: center; border: 0; border-top: 6px solid #5a51b8; cursor: pointer; transition: transform 0.18s, background 0.18s; '
          + (on ? 'background: #4c43a8; transform: translateX(14px); box-shadow: 0 0 30px #ffb52644;' : 'background: #3a3288;'),
        hover: () => this.setState({ hover: n }),
      };
    });
    return {
      floors,
      carTop: 14 + (5 - (lit || 1)) * 92,
      unhover: () => this.setState({ hover: 0 }),
      hasHover: lit > 0,
      noHover: lit === 0,
      lit: lit ? floors[5 - lit] : { label: '', game: '' },
      cardBorder: lit ? '#ffb526' : '#3b3380',
    };
  }
}
</script>
</body>
</html>
