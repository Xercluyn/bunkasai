<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ようこそ！1階ゲームへ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=M+PLUS+Rounded+1c:wght@500;700;800&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="wrap">
  <header class="brand">
    <h1>ようこそ！<span>1階ゲーム</span>へ〜</h1>
  </header>

  <section class="hud" aria-label="ゲームの状態">
    <div class="meter" id="timeMeter">
      <label for="timeVal">残り時間</label>
      <output class="val" id="timeVal">30.0<small>秒</small></output>
      <div class="timer-bar"><i id="timeBar"></i></div>
    </div>
    <div class="meter">
      <label for="scoreVal">発見数</label>
      <output class="val" id="scoreVal">0<small>/3</small></output>
      <div class="pips" id="scorePips" aria-hidden="true"><b></b><b></b><b></b></div>
    </div>
    <div class="meter" id="tapMeter">
      <label for="tapVal">残り回数</label>
      <output class="val" id="tapVal">7<small>/7</small></output>
      <div class="pips taps" id="tapPips" aria-hidden="true"><b></b><b></b><b></b><b></b><b></b><b></b><b></b></div>
    </div>
  </section>

  <main class="board" id="board" aria-label="カード"></main>

  <div class="actions">
    <button class="btn-sub" id="restartPlayBtn" type="button" disabled>↻ リスタート</button>
    <button class="btn-sub" id="passBtn" type="button" disabled>一時停止中</button>
  </div>

  <p class="foot">「↑」を3枚見つけよう！</p>
</div>

<!-- Start screen -->
<div class="overlay" id="startScreen">
  <div class="panel start">
    <h2>ようこそ！<br><span>1階ゲーム</span>へ〜</h2>
    <ul class="rules">
      <li><b class="g">↑</b><span>「↑」のカードを3枚見つけよう！</span></li>
      <li><b class="r">✕</b><span>違うカードは「?」に戻ります。場所を覚えよう！</span></li>
      <li><b class="y">7</b><span>押せるのは7回まで。</span></li>
      <li><b class="r">30</b><span>制限時間は30秒。急げ！</span></li>
      <li><b class="y">▶▶</b><span>「パス」で一時停止、「続ける」で再開！</span></li>
    </ul>
    <button class="btn" id="startBtn" type="button">スタート！</button>
  </div>
</div>

<!-- Win screen -->
<div class="overlay" id="winScreen" hidden>
  <div class="panel win">
    <h2>おめでとう！🎉</h2>
    <div class="stat">
      <div><label>クリアタイム</label><strong id="winTime">0.0秒</strong></div>
      <div><label>発見数</label><strong>3/3</strong></div>
    </div>
    <button class="btn" id="againBtn" type="button">次のステージへ</button>
  </div>
</div>

<!-- Game over screen -->
<div class="overlay" id="loseScreen" hidden>
  <div class="panel lose">
    <h2>ゲームオーバー！</h2>
    <div class="stat">
      <div><label>理由</label><strong id="loseReason" class="jp">時間切れ</strong></div>
      <div><label>発見数</label><strong id="loseScore">0/3</strong></div>
    </div>
    <p class="reason" id="loseNote"></p>
    <button class="btn" id="restartBtn" type="button">もう一度</button>
  </div>
</div>

<!-- Pass screen -->
<div class="overlay" id="passScreen" hidden>
  <div class="panel start">
    <h2>一時停止中</h2>
    <div class="stat">
      <div><label>残り時間</label><strong id="passTime">0.0秒</strong></div>
      <div><label>発見数</label><strong id="passScore">0/3</strong></div>
      <div><label>残り回数</label><strong id="passTaps">7/7</strong></div>
    </div>
    <p class="reason">ゲームを一時停止しました。「続ける」で止めた所から再開します。</p>
    <button class="btn" id="passNextBtn" type="button">続ける ▶</button>
    <button class="btn-sub" id="pauseRestartBtn" type="button">↻ リスタート</button>
  </div>
</div>

<canvas id="confetti" aria-hidden="true"></canvas>

<script src="script.js"></script>
</body>
</html>
